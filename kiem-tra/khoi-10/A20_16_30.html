<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra - Lớp 11A2 (STT 16 - 30)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 30px 16px; display: flex; justify-content: center; }
        .box { background: white; max-width: 650px; width: 100%; padding: 30px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); text-align: center; border: 1px solid #e2e8f0; }
        h2 { color: #2563eb; margin-top: 10px; }
        .badge { background: #eff6ff; color: #1d4ed8; padding: 6px 14px; border-radius: 20px; font-weight: 600; display: inline-block; font-size: 13px; }
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #2563eb; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="box">
        <span class="badge"><i class="fas fa-graduation-cap"></i> THPT HÙNG VƯƠNG</span>
        <h2>Phòng Thi Trực Tuyến: Lớp 11A2</h2>
        <p style="color: #64748b; font-size: 15px;">Dành riêng cho học sinh có số thứ tự: <strong>16 - 30</strong></p>
        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 20px 0;">
        <p style="font-size: 14px; color: #475569;">Nội dung đề kiểm tra đã sẵn sàng. Chúc các em làm bài tốt và đạt kết quả cao!</p>
        <a href="index.html" class="btn"><i class="fas fa-arrow-left"></i> Quay lại phòng chờ</a>
    </div>
</body>
</html>
