ối vào điện áp xoay chiều có biểu thức \u003cspan class=\"math inline tex-source\">\\(u = 220\\sqrt{2}\\cos(100\\pi t)\\text{~V}\\)\u003c/span>.\n\nĐiện áp hiệu dụng định mức của thiết bị này là:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(220\\sqrt{2}\\text{~V}\\)\u003c/span>.\u003c/p>"},{"origLabel":"B","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(110\\text{~V}\\)\u003c/span>.\u003c/p>"},{"origLabel":"C","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(220\\text{~V}\\)\u003c/span>.\u003c/p>"},{"origLabel":"D","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(110\\sqrt{2}\\text{~V}\\)\u003c/span>.\u003c/p>"}],"answer":"C","guide":""},{"id":"qjfxbqkxmrkuf6w2","no":24,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Điện áp xoay chiều\n\ngiữa hai đầu một đoạn mạch có biểu thức \u003cspan class=\"math inline tex-source\">\\(u = 311\\cos(100\\pi t)\\text{~V}\\)\u003c/span>. Tần số của điện áp này bằng:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(100\\text{~Hz}\\)\u003c/span>.\u003c/p>"},{"origLabel":"B","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(50\\text{~Hz}\\)\u003c/span>.\u003c/p>"},{"origLabel":"C","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(60\\text{~Hz}\\)\u003c/span>.\u003c/p>"},{"origLabel":"D","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(100\\pi\\text{~Hz}\\)\u003c/span>.\u003c/p>"}],"answer":"B","guide":""},{"id":"q0ah6dckmrkuf6w3","no":25,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Một máy phát điện xoay chiều\n\nmột pha có rôto gồm có \u003cspan class=\"math inline tex-source\">\\(p = 4\\)\u003c/span> cặp\n\ncực (4 cực nam và 4 cực bắc). Để tạo ra dòng điện xoay chiều có tần số\n\n\u003cspan class=\"math inline tex-source\">\\(f = 50\\text{~Hz}\\)\u003c/span> thì rôto phải quay\n\nvới tốc độ bằng bao nhiêu vòng/giây?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(12,5\\text{~vòng/giây}\\)\u003c/span>.\u003c/p>"},{"origLabel":"B","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(25\\text{~vòng/giây}\\)\u003c/span>.\u003c/p>"},{"origLabel":"C","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(50\\text{~vòng/giây}\\)\u003c/span>.\u003c/p>"},{"origLabel":"D","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(100\\text{~vòng/giây}\\)\u003c/span>.\u003c/p>"}],"answer":"A","guide":""},{"id":"qa5sls7dmrkuf6w3","no":27,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Một máy biến áp lí tưởng có số\n\nvòng dây cuộn sơ cấp là \u003cspan class=\"math inline tex-source\">\\(N_{1} = 1200\\)\u003c/span> vòng và cuộn thứ cấp là \u003cspan class=\"math inline tex-source\">\\(N_{2} = 120\\)\u003c/span> vòng. Nếu đặt vào hai đầu cuộn sơ cấp một điện áp hiệu\n\ndụng \u003cspan class=\"math inline tex-source\">\\(U_{1} = 220\\text{~V}\\)\u003c/span> thì điện\n\náp hiệu dụng ở hai đầu cuộn thứ cấp thu được bằng:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(22\\text{~V}\\)\u003c/span>.\u003c/p>"},{"origLabel":"B","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(2200\\text{~V}\\)\u003c/span>.\u003c/p>"},{"origLabel":"C","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(12\\text{~V}\\)\u003c/span>.\u003c/p>"},{"origLabel":"D","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(110\\text{~V}\\)\u003c/span>.\u003c/p>"}],"answer":"A","guide":""},{"id":"qk11g8j2mrkuf6w4","no":28,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Một sạc điện thoại không dây\n\nsử dụng công nghệ sạc nhanh, có cuộn sơ cấp đặt ở đế sạc với số vòng dây\n\n\u003cspan class=\"math inline tex-source\">\\(N_{1} = 200\\)\u003c/span> vòng và cuộn thứ cấp\n\ntích hợp trong điện thoại có \u003cspan class=\"math inline tex-source\">\\(N_{2} = 100\\)\u003c/span> vòng. Điện áp xoay chiều đầu vào của cuộn sơ cấp là \u003cspan class=\"math inline tex-source\">\\(12\\text{~V}\\)\u003c/span>. Giả sử hiệu suất truyền tải\n\nlí tưởng đạt \u003cspan class=\"math inline tex-source\">\\(100\\%\\)\u003c/span>, điện áp đầu ra\n\nthực tế ở cuộn thứ cấp là:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(24\\text{~V}\\)\u003c/span>.\u003c/p>"},{"origLabel":"B","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(6\\text{~V}\\)\u003c/span>.\u003c/p>"},{"origLabel":"C","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(12\\text{~V}\\)\u003c/span>.\u003c/p>"},{"origLabel":"D","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(5\\text{~V}\\)\u003c/span>.\u003c/p>"}],"answer":"B","guide":""},{"id":"qz5cjc08mrkuf6w4","no":29,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Để giảm thiểu hao phí\n\nđiện năng do tỏa nhiệt bởi dòng điện Foucault chạy trong lõi sắt của máy\n\nbiến áp, người ta thường thực hiện biện pháp nào?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Thay thế lõi sắt bằng một khối đồng đúc nguyên chất liền khối.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Ghép cách điện nhiều lá sắt mỏng pha silicon lại với nhau thay\n\nvì dùng một khối sắt nguyên vẹn.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Sơn một lớp sơn cách điện dày bên ngoài vỏ bọc máy biến áp.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Quấn các cuộn dây sơ cấp và thứ cấp chồng lên nhau không có lớp\n\ncách điện.\u003c/p>"}],"answer":"B","guide":""},{"id":"qqxuk5nwmrkuf6w5","no":30,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Đoạn dây dẫn thẳng dài \u003cspan class=\"math inline tex-source\">\\(l = 20\\text{~cm}\\)\u003c/span> mang dòng điện \u003cspan class=\"math inline tex-source\">\\(I\\)\u003c/span> đặt trong từ trường đều có cảm ứng từ\n\n\u003cspan class=\"math inline tex-source\">\\(B = 0,5\\text{~T}\\)\u003c/span> sao cho đoạn dây\n\nhợp với hướng của từ trường một góc \u003cspan class=\"math inline tex-source\">\\(30^{\\circ}\\)\u003c/span>. Biết lực từ tác dụng lên đoạn\n\ndây có độ lớn \u003cspan class=\"math inline tex-source\">\\(F = 0,1\\text{~N}\\)\u003c/span>.\n\nCường độ dòng điện \u003cspan class=\"math inline tex-source\">\\(I\\)\u003c/span> chạy qua dây\n\ndẫn bằng:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(1\\text{~A}\\)\u003c/span>.\u003c/p>"},{"origLabel":"B","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(2\\text{~A}\\)\u003c/span>.\u003c/p>"},{"origLabel":"C","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(4\\text{~A}\\)\u003c/span>.\u003c/p>"},{"origLabel":"D","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(0,5\\text{~A}\\)\u003c/span>.\u003c/p>"}],"answer":"B","guide":""},{"id":"qkntnp85mrkuf6w5","no":1,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Một kim nam châm nhỏ đang nằm cân bằng dọc\n\ntheo một đường sức từ của một từ trường đều. Nếu ta tác dụng lực làm nó\n\nquay lệch đi một góc nhỏ rồi buông tay thì:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Kim nam châm sẽ đứng yên tại vị trí mới do từ trường đều không làm\n\nthay đổi xu hướng quay.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Kim nam châm sẽ quay liên tục theo một chiều xác định.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Kim nam châm sẽ dao động quanh vị trí cân bằng ban đầu vì mômen\n\nlực từ luôn có xu hướng đưa nó trở lại hướng của đường sức từ.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Kim nam châm sẽ ngay lập tức đảo ngược cực Bắc và Nam.\u003c/p>"}],"answer":"C","guide":""},{"id":"qc92oi1umrkuf6w6","no":2,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Một đoạn dây dẫn thẳng mang dòng điện ổn định\n\nđược đặt trong từ trường đều. Khi thay đổi góc \u003cspan class=\"math inline tex-source\">\\(\\alpha\\)\u003c/span> hợp bởi đoạn dây và các đường sức\n\ntừ (với \u003cspan class=\"math inline tex-source\">\\(0 &lt; \\alpha &lt; 90^{\\circ}\\)\u003c/span>), độ lớn của lực từ tác dụng lên dây dẫn sẽ thay đổi\n\nnhư thế nào nếu \u003cspan class=\"math inline tex-source\">\\(\\alpha\\)\u003c/span> tăng\n\ndần?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Giảm dần vì lực từ tỉ lệ nghịch với góc \u003cspan class=\"math inline tex-source\">\\(\\alpha\\)\u003c/span>.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Tăng dần vì hàm số \u003cspan class=\"math inline tex-source\">\\(\\sin\\alpha\\)\u003c/span> tăng liên tục khi góc \u003cspan class=\"math inline tex-source\">\\(\\alpha\\)\u003c/span> tăng từ \u003cspan class=\"math inline tex-source\">\\(0\\)\u003c/span> đến \u003cspan class=\"math inline tex-source\">\\(90^{\\circ}\\)\u003c/span>.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Không đổi vì từ trường là từ trường đều và dòng điện không\n\nđổi.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Tăng đến giá trị cực đại rồi giảm về 0.\u003c/p>"}],"answer":"B","guide":""},{"id":"qahpvkvomrkuf6w6","no":3,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Hai dây dẫn thẳng, dài, đặt song song gần\n\nnhau và mang hai dòng điện cùng chiều. Khi quan sát hiện tượng, người ta\n\nthấy chúng hút nhau. Logic nào sau đây giải thích đúng bản chất của hiện\n\ntượng này?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Bản chất là hai dòng điện cùng chiều tích điện trái dấu nên hút\n\nnhau bằng lực Culông.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Dòng điện thứ nhất sinh ra từ trường, từ trường này tác dụng lực\n\ntừ lên dòng điện thứ hai và ngược lại theo xu hướng kéo chúng lại gần\n\nnhau.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Lực hút này là do lực hấp dẫn giữa hai khối lượng của dây dẫn tăng\n\nlên khi có dòng điện chạy qua.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Các đường sức từ giữa hai dây bị triệt tiêu hoàn toàn làm xuất\n\nhiện áp suất chân không đẩy hai dây vào nhau.\u003c/p>"}],"answer":"B","guide":""},{"id":"qsw7f2tnmrkuf6w6","no":4,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Khi một vòng dây kín phẳng tịnh tiến (không\n\nthay đổi hình dạng, không quay) trong một \u003cstrong>từ trường\n\nđều\u003c/strong>, từ thông qua vòng dây sẽ:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Biến thiên liên tục vì vị trí của vòng dây thay đổi so với nguồn\n\nnguồn sinh ra từ trường.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Luôn bằng không vì vòng dây không dịch chuyển cắt các đường sức\n\ntừ.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Không đổi theo thời gian vì mật độ đường sức từ và góc hợp bởi\n\npháp tuyến với từ trường tại mọi vị trí tịnh tiến là như nhau.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Tăng dần nếu vòng dây chuyển động nhanh dần đều.\u003c/p>"}],"answer":"C","guide":""},{"id":"qsad6bdbmrkuf6w7","no":5,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Có một khung dây phẳng kín đặt vuông góc với\n\ncác đường cảm ứng từ của một từ trường đều. Người ta làm thay đổi từ\n\nthông qua khung bằng cách bóp méo khung dây làm diện tích của nó giảm\n\nđi. Trong quá trình bóp méo khung, hiện tượng gì xảy ra?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Không có dòng điện cảm ứng vì từ trường \u003cspan class=\"math inline tex-source\">\\(B\\)\u003c/span> không đổi.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Xuất hiện dòng điện cảm ứng vì từ thông qua khung biến thiên do\n\ndiện tích thay đổi.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Xuất hiện dòng điện cảm ứng chỉ khi từ trường biến thiên.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Khung dây bị đẩy tịnh tiến dọc theo đường sức từ.\u003c/p>"}],"answer":"B","guide":""},{"id":"qwatlo6zmrkuf6w7","no":6,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Giả sử một đường sức từ của một từ trường bất\n\nkỳ được vẽ thành một đường cong hở. Điều này vi phạm tính chất logic cơ\n\nbản nào của từ trường?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Vi phạm tính chất từ trường tồn tại xung quanh dòng điện.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Vi phạm nguyên lí chồng chất từ trường.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Vi phạm bản chất từ trường là một trường xoáy (các đường sức từ\n\nphải là các đường cong khép kín hoặc vô hạn ở hai đầu, không có điểm bắt\n\nđầu hay kết thúc giống như điện trường tĩnh).\u003c/p>"},{"origLabel":"D","html":"\u003cp>Vi phạm quy tắc bàn tay trái.\u003c/p>"}],"answer":"C","guide":""},{"id":"qcvly8ygmrkuf6w8","no":7,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Một electron bay vào một vùng từ trường đều\n\ntheo hướng song song với các đường sức từ. Quỹ đạo chuyển động của\n\nelectron trong từ trường này sẽ là:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Đường tròn, vì lực từ đóng vai trò lực hướng tâm.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Đường parabol, tương tự như chuyển động ném ngang trong trọng\n\ntrường.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Đường thẳng, vì lực từ tác dụng lên electron bằng 0 khi góc hợp\n\nbởi vận tốc và cảm ứng từ bằng 0.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Đường xoắn ốc quanh các đường sức từ.\u003c/p>"}],"answer":"C","guide":""},{"id":"q5kemzxqmrkuf6w8","no":8,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Một khung dây phẳng chuyển động lại gần một\n\nnam châm thẳng đang đứng yên. Logics nào sau đây đúng khi mô tả về mặt\n\ntừ lực tương tác giữa chúng?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Nam châm và khung dây hút nhau để thúc đẩy chuyển động diễn ra\n\nnhanh hơn.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Giữa chúng xuất hiện lực từ đẩy nhau nhằm chống lại xu hướng\n\nchuyển động lại gần của khung dây (theo định luật Lenz).\u003c/p>"},{"origLabel":"C","html":"\u003cp>Không có lực tương tác nào xuất hiện vì khung dây không phải là\n\nnam châm vĩnh cửu.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Chỉ xuất hiện lực hút nếu mặt của khung dây đối diện với cực Bắc\n\ncủa nam châm là mặt Nam.\u003c/p>"}],"answer":"B","guide":""},{"id":"q5shrd28mrkuf6w8","no":9,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Để tăng từ thông qua một mạch kín phẳng đặt\n\nvuông góc với đường sức từ của một từ trường đều thêm 4 lần, hệ thống\n\nnào sau đây thực hiện \u003cstrong>sai\u003c/strong> logic?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Tăng độ lớn cảm ứng từ lên 4 lần và giữ nguyên diện tích.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Giữ nguyên cảm ứng từ và tăng bán kính của khung dây tròn lên gấp\n\nđôi.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Giữ nguyên cảm ứng từ và tăng diện tích khung dây lên 4 lần.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Quay khung dây một góc \u003cspan class=\"math inline tex-source\">\\(60^{\\circ}\\)\u003c/span> quanh trục nằm trong mặt phẳng\n\nkhung.\u003c/p>"}],"answer":"D","guide":""},{"id":"qqb4cdtamrkuf6w9","no":10,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Khi một nam châm rơi tự do xuyên qua một\n\nvòng dây đồng đặt nằm ngang cố định. Trong giai đoạn nam châm đang đi\n\nxuyên và \u003cstrong>rời khỏi\u003c/strong> vòng dây (rơi ở phía dưới vòng dây),\n\ndòng điện cảm ứng xuất hiện trong vòng dây có xu hướng:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Tạo ra từ trường cùng chiều với từ trường nam châm để hút giữ\n\nnam châm lại (chống lại sự ra xa).\u003c/p>"},{"origLabel":"B","html":"\u003cp>Tạo ra từ trường ngược chiều để đẩy nam châm rơi nhanh hơn.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Triệt tiêu hoàn toàn vì nam châm đã đi qua rồi.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Giữ nguyên cường độ và chiều giống như giai đoạn nam châm đi vào\n\nvòng dây.\u003c/p>"}],"answer":"A","guide":""},{"id":"qk5lttllmrkuf6w9","no":11,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Nếu một mạch điện kín có từ thông biến thiên\n\ntheo thời gian với tốc độ biến thiên \u003cspan class=\"math inline tex-source\">\\(\\frac{\\Delta\\Phi}{\\Delta t}\\)\u003c/span> là một hằng\n\nsố không đổi (khác 0), suất điện động cảm ứng trong mạch sẽ:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Biến thiên điều hòa theo thời gian.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Tăng dần theo thời gian.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Không đổi theo thời gian (có giá trị hằng số).\u003c/p>"},{"origLabel":"D","html":"\u003cp>Bằng không vì tốc độ biến thiên không tăng trưởng.\u003c/p>"}],"answer":"C","guide":""},{"id":"qkym0lzsmrkuf6wa","no":12,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Đồ thị biểu diễn sự phụ thuộc của từ thông\n\n\u003cspan class=\"math inline tex-source\">\\(\\Phi\\)\u003c/span> qua một mạch kín theo thời\n\ngian \u003cspan class=\"math inline tex-source\">\\(t\\)\u003c/span> là một đường thẳng đi qua\n\ngốc tọa độ (hàm số bậc nhất). Đồ thị biểu diễn suất điện động cảm ứng\n\n\u003cspan class=\"math inline tex-source\">\\(e_{c}\\)\u003c/span> theo thời gian \u003cspan class=\"math inline tex-source\">\\(t\\)\u003c/span> sẽ là:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Một đường thẳng song song với trục thời gian \u003cspan class=\"math inline tex-source\">\\(t\\)\u003c/span>.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Một đường thẳng cũng đi qua gốc tọa độ.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Một đường cong parabol.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Một đường hình sin.\u003c/p>"}],"answer":"A","guide":""},{"id":"qy9l77mpmrkuf6wa","no":13,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Hai khung dây dẫn kín giống hệt nhau, khung\n\n(1) làm bằng đồng (điện trở rất nhỏ), khung (2) làm bằng nhôm (điện trở\n\nlớn hơn). Khi cùng làm cho từ thông qua hai khung giảm đều từ một giá\n\ntrị như nhau về bằng không trong cùng một khoảng thời gian, phát biểu\n\nnào sau đây đúng về mặt logic?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Suất điện động cảm ứng ở khung (1) lớn hơn khung (2).\u003c/p>"},{"origLabel":"B","html":"\u003cp>Dòng điện cảm ứng ở hai khung có cường độ bằng nhau.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Suất điện động cảm ứng ở hai khung bằng nhau, nhưng dòng điện\n\ncảm ứng ở khung (1) lớn hơn khung (2).\u003c/p>"},{"origLabel":"D","html":"\u003cp>Điện lượng dịch chuyển qua khung (2) lớn hơn khung (1).\u003c/p>"}],"answer":"C","guide":""},{"id":"qhkvtcammrkuf6wa","no":14,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Khi một thanh dẫn điện chuyển động cắt các\n\nđường sức từ của một từ trường đều, trong thanh xuất hiện một suất điện\n\nđộng cảm ứng. Bản chất của suất điện động này được giải thích logic\n\nbằng:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Sự biến mất của các điện tích tự do trong thanh do ma sát với từ\n\ntrường.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Lực từ (lực Lorentz) tác dụng lên các electron tự do trong thanh\n\nkhi thanh chuyển động, làm chúng dịch chuyển về một đầu thanh.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Lực điện trường tĩnh làm thay đổi cấu trúc của thanh.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Hiện tượng tỏa nhiệt Joule-Lenz làm tách dòng điện.\u003c/p>"}],"answer":"B","guide":""},{"id":"qd8k11yymrkuf6wb","no":15,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Trong các lò nấu mì, bếp từ thường làm nóng\n\nnồi nấu rất nhanh, nhưng bề mặt bếp (nếu không tiếp xúc với nồi) lại\n\nkhông bị nóng lên nhiều. Nguyên lý suy luận nào giải thích đúng hiện\n\ntượng này?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Bếp từ phát ra bức xạ hồng ngoại cường độ cao chỉ tác dụng lên kim\n\nloại.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Dòng điện xoay chiều tần số cao trong bếp tạo ra từ trường biến\n\nthiên, từ trường này sinh ra dòng điện Foucault (dòng điện cảm ứng trong\n\nkhối vật dẫn) xoay mạnh trong đáy nồi bằng vật liệu nhiễm từ, sinh nhiệt\n\nJoule làm nóng nồi.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Thủy tinh của mặt bếp có khả năng triệt tiêu hoàn toàn mọi nguồn\n\nnhiệt lượng sinh ra từ dòng điện Foucault.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Nồi nấu hấp thụ các electron trực tiếp phóng ra từ mặt bếp.\u003c/p>"}],"answer":"B","guide":""},{"id":"qxw72rpjmrkuf6wb","no":16,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Các lá thép trong lõi của máy biến áp thường\n\nđược phủ một lớp sơn cách điện mỏng trước khi ép chặt lại với nhau.\n\nLogic của việc chia nhỏ lõi thép thành nhiều lá mỏng là để:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Giảm trọng lượng của máy biến áp nhằm tiết kiệm nguyên liệu.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Tăng cường độ cảm ứng từ trong lõi sắt.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Làm tăng điện trở đối với dòng điện Foucault, từ đó hạn chế\n\ncường độ dòng Foucault và giảm hao phí năng lượng do tỏa nhiệt.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Giúp cách điện hoàn toàn giữa cuộn sơ cấp và cuộn thứ cấp.\u003c/p>"}],"answer":"C","guide":""},{"id":"qd67zehbmrkuf6wc","no":17,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Một đĩa kim loại bằng đồng quay đều quanh\n\ntrục của nó trong một từ trường đều có các đường sức từ song song với\n\ntrục quay. Phát biểu nào sau đây đúng về trạng thái của đĩa?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Trong đĩa xuất hiện dòng điện Foucault mạnh làm đĩa nhanh chóng\n\ndừng lại.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Không xuất hiện dòng điện Foucault vì từ thông qua các phần của\n\nđĩa không biến thiên khi đĩa quay đều quanh trục song song với đường sức\n\ntừ.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Đĩa sẽ tự động quay nhanh dần do lực hãm điện từ đảo chiều.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Đĩa bị nhiễm từ mạnh và biến thành một nam châm vĩnh cửu.\u003c/p>"}],"answer":"B","guide":""},{"id":"qajtginkmrkuf6wc","no":18,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Hiện tượng tự cảm (xuất hiện suất điện động\n\ntự cảm khi dòng điện trong mạch biến thiên) thực chất là:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Một hiện tượng điện độc lập hoàn toàn, không liên quan đến cảm ứng\n\nđiện từ.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Trường hợp đặc biệt của hiện tượng cảm ứng điện từ, trong đó sự\n\nbiến thiên từ thông qua mạch được gây ra bởi chính sự biến thiên của\n\ncường độ dòng điện trong mạch đó.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Hiện tượng dòng điện tự phóng ra khi mạch bị ngắt đột ngột mà\n\nkhông cần từ trường.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Hệ quả của việc thay đổi điện trở của dây quấn khi nhiệt độ\n\ntăng.\u003c/p>"}],"answer":"B","guide":""},{"id":"q7hl3wnqmrkuf6wc","no":19,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Khi đóng khóa K để dòng điện đi vào một ống\n\ndây có độ tự cảm lớn, đèn gắn song song với ống dây không sáng lên ngay\n\nlập tức mà sáng lên một cách từ từ. Logic suy luận nào giải thích đúng\n\nhiện tượng này?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Do dòng điện ban đầu bị suy hao qua điện trở của ống dây.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Khi đóng mạch, cường độ dòng điện tăng lên làm từ thông qua ống\n\ndây tăng, sinh ra suất điện động tự cảm sinh ra dòng điện tự cảm ngược\n\nchiều chống lại sự tăng của dòng điện nguồn.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Do các electron chuyển động trong ống dây chậm hơn trong dây dẫn\n\nthẳng.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Suất điện động tự cảm đồng pha với dòng điện nguồn làm chập mạch\n\ncục bộ.\u003c/p>"}],"answer":"B","guide":""},{"id":"qsczty44mrkuf6wd","no":20,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Khi ngắt đột ngột một mạch điện có chứa một\n\ncuộn cảm (ống dây có nhiều vòng quấn quanh lõi sắt), người ta thường\n\nthấy có tia lửa điện bắn ra tại vị trí công tắc ngắt điện. Nguyên nhân\n\nlogic là:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Công tắc bị hỏng lớp cách điện do dòng điện quá tải.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Khi ngắt mạch, dòng điện giảm đột ngột về 0 làm từ thông giảm\n\ncực nhanh, sinh ra suất điện động tự cảm có giá trị rất lớn tạo ra điện\n\ntrường đủ mạnh để ion hóa không khí giữa hai cực công tắc.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Nhiệt độ tại công tắc tăng cao đột ngột do ma sát cơ học.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Điện áp nguồn tăng vọt lên vô hạn khi mạch bị hở.\u003c/p>"}],"answer":"B","guide":""},{"id":"qsfxoqe2mrkuf6wd","no":21,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Một khung dây dẫn phẳng dẹt quay đều quanh\n\nmột trục nằm ngang vuông góc với các đường sức của một từ trường đều.\n\nTại thời điểm từ thông qua khung dây đạt giá trị cực đại (\u003cspan class=\"math inline tex-source\">\\(\\Phi = \\Phi_{0}\\)\u003c/span>) thì suất điện động cảm\n\nứng trong khung dây có độ lớn bằng bao nhiêu?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Đạt giá trị cực đại (\u003cspan class=\"math inline tex-source\">\\(E_{0}\\)\u003c/span>).\u003c/p>"},{"origLabel":"B","html":"\u003cp>Bằng không (\u003cspan class=\"math inline tex-source\">\\(e = 0\\)\u003c/span>), vì suất\n\nđiện động tỉ lệ với tốc độ biến thiên từ thông (đạo hàm của từ thông),\n\ntại đỉnh cực đại thì tốc độ biến thiên bằng 0 (suất điện động và từ\n\nthông vuông pha).\u003c/p>"},{"origLabel":"C","html":"\u003cp>Bằng một nửa giá trị cực đại.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Không thể xác định được vì chưa biết vận tốc góc của khung.\u003c/p>"}],"answer":"B","guide":""},{"id":"qnettgglmrkuf6wd","no":22,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Thiết bị đo điện xoay chiều (như ampe kế\n\nnhiệt, vôn kế nhiệt) hoạt động dựa trên tác dụng nhiệt của dòng điện. Số\n\nchỉ của các thiết bị này cho ta biết giá trị nào của đại lượng cần\n\nđo?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Giá trị cực đại (\u003cspan class=\"math inline tex-source\">\\(I_{0}\\)\u003c/span> hoặc\n\n\u003cspan class=\"math inline tex-source\">\\(U_{0}\\)\u003c/span>).\u003c/p>"},{"origLabel":"B","html":"\u003cp>Giá trị tức thời tại thời điểm đọc số chỉ (\u003cspan class=\"math inline tex-source\">\\(i\\)\u003c/span> hoặc \u003cspan class=\"math inline tex-source\">\\(u\\)\u003c/span>).\u003c/p>"},{"origLabel":"C","html":"\u003cp>Giá trị trung bình trong một chu kì.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Giá trị hiệu dụng (\u003cspan class=\"math inline tex-source\">\\(I\\)\u003c/span> hoặc\n\n\u003cspan class=\"math inline tex-source\">\\(U\\)\u003c/span>).\u003c/p>"}],"answer":"D","guide":""},{"id":"q7n1d2aqmrkuf6we","no":23,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Nguyên tắc hoạt động của máy phát điện xoay\n\nchiều một pha dựa trên hệ quả logic nào?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Chuyển hóa trực tiếp điện năng thành cơ năng dựa trên lực\n\nLorentz.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Sử dụng cơ năng quay rôto làm biến thiên từ thông qua các cuộn\n\ndây stationary (stato), sinh ra suất điện động cảm ứng xoay chiều dựa\n\ntrên hiện tượng cảm ứng điện từ.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Sử dụng dòng điện một chiều để kích thích sinh ra dòng điện xoay\n\nchiều thông qua lõi sắt.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Tận dụng hiện tượng tự cảm của cuộn dây khi dòng điện thay\n\nđổi.\u003c/p>"}],"answer":"B","guide":""},{"id":"q7681gtqmrkuf6wf","no":24,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Một máy phát điện một pha có \u003cspan class=\"math inline tex-source\">\\(p\\)\u003c/span> cặp cực, rôto quay với tốc độ \u003cspan class=\"math inline tex-source\">\\(n\\)\u003c/span> (vòng/phút). Tần số dòng điện sinh ra\n\nlà \u003cspan class=\"math inline tex-source\">\\(f = \\frac{n.p}{60}\\)\u003c/span>. Nếu tăng số\n\ncặp cực lên gấp đôi và giảm tốc độ quay của rôto đi một nửa thì tần số\n\ncủa dòng điện xoay chiều phát ra sẽ:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Tăng lên gấp đôi.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Giảm đi một nửa.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Không thay đổi.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Tăng lên 4 lần.\u003c/p>"}],"answer":"C","guide":""},{"id":"qnxhjvhfmrkuf6wf","no":25,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Hệ thống truyền tải điện năng quốc gia sử\n\ndụng dòng điện xoay chiều cao áp (ví dụ đường dây 510 kV). Tại sao người\n\nta không truyền tải điện năng ở điện áp thấp (220 V) ngay từ nhà máy\n\nđiện?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Vì dòng điện ở điện áp thấp không thể di chuyển quãng đường\n\nxa.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Vì hao phí công suất do tỏa nhiệt trên đường dây truyền tải tỉ\n\nlệ nghịch với bình phương điện áp (\u003cspan class=\"math inline tex-source\">\\(P_{hp} \\sim \\frac{1}{U^{2}}\\)\u003c/span>), nâng điện áp lên cao giúp giảm hao phí\n\nmột cách cực kỳ hiệu quả.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Điện áp thấp dễ gây ra hiện tượng đoản mạch trên diện rộng.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Các nhà máy điện chỉ có khả năng sản xuất ra điện áp cực cao.\u003c/p>"}],"answer":"B","guide":""},{"id":"qk6yv2c0mrkuf6wf","no":26,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Một máy biến áp lí tưởng có tỉ số vòng dây\n\n\u003cspan class=\"math inline tex-source\">\\(\\frac{N_{2}}{N_{1}} = 2\\)\u003c/span>. Nếu ta đặt\n\nvào hai đầu cuộn sơ cấp một \u003cstrong>điện áp một chiều không đổi\u003c/strong>\n\ncó giá trị \u003cspan class=\"math inline tex-source\">\\(U\\)\u003c/span>, thì điện áp ở hai đầu\n\ncuộn thứ cấp thu được sẽ bằng:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(2U\\)\u003c/span>.\u003c/p>"},{"origLabel":"B","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(\\frac{U}{2}\\)\u003c/span>.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Bằng 0, vì dòng điện một chiều không đổi tạo ra từ thông không\n\nbiến thiên, không thể xảy ra hiện tượng cảm ứng điện từ ở cuộn thứ\n\ncấp.\u003c/p>"},{"origLabel":"D","html":"\u003cp>\u003cspan class=\"math inline tex-source\">\\(U\\sqrt{2}\\)\u003c/span>.\u003c/p>"}],"answer":"B","guide":""},{"id":"qyfoieoamrkuf6wg","no":27,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Mối liên hệ logic giữa cường độ dòng điện\n\nhiệu dụng và số vòng dây trong các cuộn dây của một máy biến áp lí tưởng\n\nkhi hoạt động bình thường là:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Cường độ dòng điện hiệu dụng tỉ lệ thuận với số vòng dây cuộn\n\nđó.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Cường độ dòng điện hiệu dụng tỉ lệ nghịch với số vòng dây cuộn\n\nđó (\u003cspan class=\"math inline tex-source\">\\(\\frac{I_{1}}{I_{2}} = \\frac{N_{2}}{N_{1}}\\)\u003c/span>), nghĩa là máy tăng áp thì sẽ giảm dòng để\n\nbảo toàn công suất.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Cường độ dòng điện hiệu dụng không phụ thuộc vào số vòng dây.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Tích của cường độ dòng điện hiệu dụng và số vòng dây luôn bằng một\n\nhằng số cố định cho mọi máy biến áp.\u003c/p>"}],"answer":"B","guide":""},{"id":"qaako5vtmrkuf6wg","no":28,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Trong công nghệ sạc không dây cho điện\n\nthoại, nếu đặt một miếng kim loại dày (như đồng xu hoặc chìa khóa) vào\n\ngiữa đế sạc và mặt lưng điện thoại đang sạc thì điều gì nguy hiểm và có\n\nkhả năng xảy ra nhất theo logic lý thuyết?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Điện thoại sẽ được sạc nhanh hơn do kim loại dẫn điện tốt.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Đế sạc sẽ tự động ngắt điện hoàn toàn do mạch điện bị ngắn\n\nmạch.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Từ trường biến thiên từ đế sạc sinh ra dòng điện Foucault rất\n\nmạnh trong miếng kim loại, làm miếng kim loại tỏa nhiệt dữ dội và có thể\n\ngây nóng chảy, cháy nổ thiết bị.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Không có hiện tượng gì xảy ra vì sạc không dây chỉ tác dụng lên\n\npin điện thoại.\u003c/p>"}],"answer":"C","guide":""},{"id":"q65rq09ymrkuf6wi","no":29,"type":"mcq","typeName":"Trắc nghiệm","level":"Nhận biết","stem":"\u003cp> Đàn guitar điện sử dụng bộ phận pickup chứa\n\ncuộn dây cảm ứng quấn quanh nam châm đặt dưới dây đàn bằng thép. Nếu\n\nthay dây đàn bằng thép bằng một dây đàn bằng \u003cstrong>nhựa nylon\u003c/strong>\n\n(loại dùng cho đàn classic) thì khi gảy đàn:\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Âm thanh phát ra loa sẽ to hơn do nhựa có độ đàn hồi cao.\u003c/p>"},{"origLabel":"B","html":"\u003cp>Loa sẽ hoàn toàn không phát ra âm thanh của dây đó, vì dây nylon\n\nkhông phải là vật liệu từ, khi dao động không làm biến thiên từ thông\n\nqua cuộn cảm ứng của pickup nên không sinh ra dòng điện cảm ứng.\u003c/p>"},{"origLabel":"C","html":"\u003cp>Tần số dòng điện cảm ứng thu được sẽ bị giảm đi một nửa.\u003c/p>"},{"origLabel":"D","html":"\u003cp>Tín hiệu điện thu được biến thành dòng một chiều ổn định.\u003c/p>"}],"answer":"B","guide":""},{"id":"qb0zmmikmrkuf6wi","no":30,"type":"mcq","typeName":"Trắc nghiệm","level":"Hiểu","stem":"\u003cp> Khi thiết kế một hệ thống cầu dao chống giật\n\n(ELCB) trong mạng điện gia đình xoay chiều, nguyên lí suy luận dựa trên\n\ncấu trúc: dòng điện đi vào tải (dây pha) và dòng điện đi ra khỏi tải\n\n(dây trung tính) đi qua một lõi từ của máy biến dòng. Ở điều kiện bình\n\nthường không rò rỉ điện, trạng thái từ trường trong lõi từ này là\n\ngì?\u003c/p>","options":[{"origLabel":"A","html":"\u003cp>Từ trường đạt giá trị cực đại do hai dòng điện hỗ trợ function scoreOneTF(q){let correct=0,total=q.items.length;q.items.forEach(it=>{if((answers[q.id]||{})[it.key]===it.answer)correct++});const sc=scoreConfig().a;let point=0;if(correct===1)point=.1*sc;else if(correct===2)point=.25*sc;else if(correct===3)point=.5*sc;else if(correct>=4)point=sc;return{correct,total,point}}
function buildDraftPayload(status='DRAFT',reason='Tự lưu tạm'){const temp=gradeQuiz(false,reason);return Object.assign({},temp,{status,submittedAt:'',updatedAt:nowISO(),doneCount:getDoneCount(),compactAnswers:compactAnswers(),isDraft:true})}
function sendDraftIfNeeded(force=false){if(CONFIG.mode!=='test'||submitted)return;const done=getDoneCount(),now=Date.now();if(!force&&now-lastDraftSync<300000&&done-lastDraftDone<5)return;const payload=buildDraftPayload('DRAFT','Tự lưu tạm');if(sendToGoogleSheet(payload,false)){lastDraftSync=now;lastDraftDone=done;localStorage.setItem(sessionKey+'_lastDraftPayload',JSON.stringify(payload))}}
function gradeQuiz(isEmergency=false,reason='Nộp bài bình thường'){const sc=scoreConfig();let total=0,rows=[];examQuestions.forEach(q=>{let stu='',cor='',point=0;if(q.type==='mcq'){stu=answers[q.id]||'';cor=q.correctLabel;point=stu===cor?sc.c:0}else if(q.type==='truefalse'){const r=scoreOneTF(q);point=r.point;stu=q.items.map(it=>it.key+':'+((answers[q.id]||{})[it.key]||'')).join('; ');cor=q.items.map(it=>it.key+':'+it.answer).join('; ')}else{stu=answers[q.id]||'';cor=q.answer;point=norm(stu)===norm(cor)?sc.b:0}total+=point;rows.push({qid:q.id,no:q.displayNo,originalNo:q.no,type:q.typeName,level:q.level,questionText:shortQuestionText(q.stem,72),studentAnswer:stu,correctAnswer:cor,point:Number(point.toFixed(3))})});const meta=securityMeta||getSecurityMeta();return{examId:CONFIG.examId||CONFIG.title,examCreatedAt:CONFIG.examCreatedAt||'',submissionId:meta?meta.submissionId:'',securityCode:meta?meta.securityCode:'',verifyCount:meta?Number(meta.verifyCount||0):0,status:'FINAL',examTitle:CONFIG.title,student,attempt:CONFIG.mode==='test'?1:attempt,score:Number(Math.min(10,total).toFixed(2)),doneCount:getDoneCount(),compactAnswers:compactAnswers(),summary:buildSheetSummary(rows),tabViolations,isEmergency,reason,startedAt:new Date(startTime).toISOString(),submittedAt:nowISO(),updatedAt:nowISO(),details:rows}}
function sendToGoogleSheet(payload,isEmergency=false){if(!CONFIG.sheetUrl)return false;const data=JSON.stringify(payload);try{if(isEmergency&&navigator.sendBeacon){const blob=new Blob([data],{type:'application/json'});return navigator.sendBeacon(CONFIG.sheetUrl,blob)}fetch(CONFIG.sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:data}).catch(()=>{localStorage.setItem(sessionKey+'_pendingSubmit',data)});return true}catch(e){localStorage.setItem(sessionKey+'_pendingSubmit',data);return false}}
function submitNormal(){if(!confirm('Xác nhận nộp bài?'))return;finalize(gradeQuiz(false,'Nộp bài bình thường'),false)}function emergencySubmit(reason){if(submitted)return;finalize(gradeQuiz(true,reason),true)}
function finalize(payload,isEmergency){submitted=true;clearInterval(timerInt);clearInterval(snapshotInt);clearInterval(draftSyncInt);payload.status='FINAL';payload.isDraft=false;payload.updatedAt=nowISO();sendToGoogleSheet(payload,isEmergency);localStorage.removeItem(sessionKey+'_snapshot');localStorage.setItem(sessionKey+'_lastResult',JSON.stringify(payload));if(CONFIG.mode==='test'){const meta=securityMeta||getSecurityMeta();if(meta){meta.submitted=true;meta.submittedAt=payload.submittedAt;setSecurityMeta(meta)}localStorage.setItem(sessionKey+'_submitted','true');localStorage.setItem(sessionKey+'_finalPayload',JSON.stringify(payload))}exam.classList.add('hidden');result.classList.remove('hidden');if(CONFIG.showResult||CONFIG.mode==='practice')renderResult(payload);else {result.innerHTML='<h2>Đã ghi nhận bài làm</h2><div class="okbox">Bài đã được nộp. Mã bảo mật: <b>'+esc(payload.securityCode||'')+'</b><br>Giáo viên sẽ công bố kết quả sau.</div>'+receiptHtml(payload);setTimeout(()=>drawReceipt(payload),80)}}
function optionHtml(q,label){if(q.type!=='mcq')return esc(label||'');const o=(q.options||[]).find(x=>x.label===label);return o?('<b>'+esc(label)+'.</b> '+o.html):esc(label||'')}
function renderPracticeResult(p){const byId={};p.details.forEach(d=>byId[d.qid]=d);result.innerHTML='<h2>Kết quả luyện tập</h2><div class="okbox"><b>Điểm: '+p.score+'/10</b><br>Học sinh: '+esc(p.student.name)+' - '+esc(p.student.clazz)+'<br>Số câu luyện: '+examQuestions.length+'/'+CONFIG.bank.length+'</div><div class="btnrow"><button onclick="practiceRedo()" type="button">Làm lại bộ câu ngẫu nhiên</button></div>'+examQuestions.map(q=>{const d=byId[q.id]||{};let body='<div>'+q.stem+'</div>';let ans='';if(q.type==='mcq'){body+=(q.options||[]).map(o=>{const isStu=d.studentAnswer===o.label,isCor=d.correctAnswer===o.label;return '<div class="opt"><span><b>'+o.label+'.</b></span><span class="choiceText">'+o.html+(isStu?' <span class="studentPick">[Em chọn]</span>':'')+(isCor?' <span class="correctPick">[Đáp án đúng]</span>':'')+'</span></div>'}).join('');ans='<div class="answerLine">Em chọn: <span class="'+(d.studentAnswer===d.correctAnswer?'correctPick':'wrongPick')+'">'+optionHtml(q,d.studentAnswer)+'</span><br>Đáp án đúng: <span class="correctPick">'+optionHtml(q,d.correctAnswer)+'</span></div>'}else if(q.type==='truefalse'){body+=(q.items||[]).map(it=>{const sv=(answers[q.id]||{})[it.key]||'';const ok=sv===it.answer;return '<div class="tfrow"><div><b>'+it.key+')</b> '+it.html+'</div><div>Em: <span class="'+(ok?'correctPick':'wrongPick')+'">'+esc(sv||'Chưa chọn')+'</span></div><div>Đúng: <span class="correctPick">'+esc(it.answer)+'</span></div></div>'}).join('')}else{ans='<div class="answerLine">Em trả lời: <span class="'+(norm(d.studentAnswer)===norm(d.correctAnswer)?'correctPick':'wrongPick')+'">'+esc(d.studentAnswer||'Chưa trả lời')+'</span><br>Đáp án đúng: <span class="correctPick">'+esc(d.correctAnswer||'')+'</span></div>'}return '<div class="practiceReview"><div class="qhead"><span class="tag">Câu '+q.displayNo+'</span><span class="tag">'+q.typeName+'</span><span class="tag">Điểm: '+(d.point||0)+'</span></div>'+body+ans+'</div>'}).join('');renderMathIfAvailable(result)}
function receiptHtml(p){if(CONFIG.mode!=='test')return '';return '<div id="receiptBox" class="receiptBox"><h3>Ảnh biên nhận kết quả</h3><div class="muted">Ảnh dùng để đối chiếu với dữ liệu Google Sheet.</div><canvas id="receiptCanvas" width="1100" height="1500" style="max-width:100%;border:1px solid #cbd5e1;border-radius:12px;background:#fff"></canvas><div class="btnrow"><button type="button" class="secondary" onclick="downloadReceipt()">Tải ảnh biên nhận</button></div></div>'}
function drawReceipt(p){if(CONFIG.mode!=='test')return;const c=document.getElementById('receiptCanvas');if(!c)return;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#163777';ctx.font='bold 34px Arial';ctx.fillText('BIÊN NHẬN KẾT QUẢ KIỂM TRA',40,55);ctx.fillStyle='#111827';ctx.font='22px Arial';let y=105;[['Bài kiểm tra',p.examTitle],['ExamID',p.examId],['SubmissionID',p.submissionId],['Học sinh',p.student.name],['Lớp',p.student.clazz],['STT/Mã HS',p.student.sid],['Điểm',p.score+'/10'],['Mã bảo mật',p.securityCode],['Thời gian nộp',p.submittedAt],['Số lần vi phạm',p.tabViolations],['Trạng thái',p.reason]].forEach(([k,v])=>{ctx.font='bold 21px Arial';ctx.fillText(k+':',40,y);ctx.font='21px Arial';ctx.fillText(String(v||''),230,y);y+=34});y+=14;ctx.font='bold 24px Arial';ctx.fillText('Đối chiếu đáp án',40,y);y+=32;ctx.font='18px Arial';(p.details||[]).slice(0,32).forEach(r=>{let line='C'+r.no+' | HS: '+(r.studentAnswer||'-')+' | Đúng: '+(r.correctAnswer||'-')+' | Điểm: '+r.point;ctx.fillText(line.slice(0,120),40,y);y+=25;if(y>1450){ctx.fillText('...',40,y);return}});}
function downloadReceipt(){const c=document.getElementById('receiptCanvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='bien-nhan-'+(CONFIG.examId||'exam')+'.png';a.click()}
function renderResult(p){if(CONFIG.mode==='practice'){renderPracticeResult(p);return}result.innerHTML='<h2>Kết quả bài làm</h2><div class="'+(p.isEmergency?'errbox':'okbox')+'"><b>Điểm: '+p.score+'/10</b><br>Học sinh: '+esc(p.student.name)+' - '+esc(p.student.clazz)+' - STT/Mã HS: '+esc(p.student.sid)+'<br>Lần làm bài chính thức: '+(p.attempt||1)+'<br>Mã bảo mật: <b>'+esc(p.securityCode||'')+'</b><br>SubmissionID: '+esc(p.submissionId||'')+'<br>Số lần xác minh lại: '+esc(p.verifyCount||0)+'<br>Trạng thái: '+esc(p.reason)+'<br>Số lần rời tab/phím hạn chế: '+p.tabViolations+'</div><h3>Chi tiết đáp án</h3><div style="overflow:auto"><table><thead><tr><th>Câu</th><th>Loại</th><th>Mức độ</th><th>Đáp án học sinh</th><th>Đáp án đúng</th><th>Điểm</th></tr></thead><tbody>'+p.details.map(r=>'<tr><td>'+r.no+'</td><td>'+esc(r.type)+'</td><td>'+esc(r.level)+'</td><td>'+esc(r.studentAnswer)+'</td><td>'+esc(r.correctAnswer)+'</td><td>'+r.point+'</td></tr>').join('')+'</tbody></table></div>'+receiptHtml(p);setTimeout(()=>drawReceipt(p),80)}
function practiceRedo(){if(CONFIG.mode!=='practice'||!student)return;submitted=false;answers={};tabViolations=0;startTime=Date.now();endTime=startTime+CONFIG.minutes*60000;examQuestions=prepareExam();result.classList.add('hidden');exam.classList.remove('hidden');studentBar.textContent=student.name+' - '+student.clazz+' - Lần làm: '+attempt+' - Luyện '+examQuestions.length+'/'+CONFIG.bank.length+' câu';renderExam();saveSnapshot();clearInterval(snapshotInt);clearInterval(timerInt);snapshotInt=setInterval(saveSnapshot,5000);timerInt=setInterval(tick,1000);tick()}
window.addEventListener('online',()=>{if(!sessionKey)return;const data=localStorage.getItem(sessionKey+'_pendingSubmit');if(data&&CONFIG.sheetUrl){fetch(CONFIG.sheetUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:data}).then(()=>localStorage.removeItem(sessionKey+'_pendingSubmit')).catch(()=>{})}})
</script></body></html>
