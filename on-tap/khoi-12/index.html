<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách nội dung</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 30px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #1a73e8; padding-bottom: 10px; color: #1a73e8; }
        .item { 
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; border-bottom: 1px solid #eee; transition: 0.2s;
            text-decoration: none; color: #444;
        }
        .item:hover { background-color: #f1f7ff; transform: translateX(5px); }
        .item i { margin-right: 10px; width: 20px; text-align: center; }
        .file-name { flex-grow: 1; font-weight: 500; }
        .loading { text-align: center; font-style: italic; color: #888; }
        .btn-back { display: inline-block; margin-bottom: 20px; color: #666; text-decoration: none; font-size: 14px; }
        .btn-back:hover { color: #1a73e8; }
    </style>
</head>
<body>

<div class="container">
    <a href="../index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
    <h2 id="folder-name"><i class="fas fa-folder-open"></i> Đang tải dữ liệu...</h2>
    <div id="file-list" class="loading">Đang quét thư mục trên GitHub...</div>
</div>

<script>
    // === CẤU HÌNH THÔNG TIN CỦA BẠN ===
    const USERNAME = "hunglysp3-afk"; 
    const REPO = "trac_nghiem_on_off";
    
    // Tự động xác định thư mục hiện tại dựa trên đường dẫn file
    // Ví dụ: nếu file ở 'trac-nghiem/index.html', PATH sẽ là 'trac-nghiem'
    const currentPath = window.location.pathname.split('/').slice(-2, -1)[0] || "";

    async function loadFiles() {
        const url = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${currentPath}`;
        const listElement = document.getElementById('file-list');
        const titleElement = document.getElementById('folder-name');

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.message === "Not Found") throw new Error("Không tìm thấy thư mục");

            titleElement.innerHTML = `<i class="fas fa-folder-open"></i> Nội dung: ${currentPath.replace(/-/g, ' ')}`;
            listElement.innerHTML = '';
            listElement.classList.remove('loading');

            data.forEach(file => {
                // Bỏ qua chính file index.html này
                if (file.name !== 'index.html') {
                    const isDir = file.type === 'dir';
                    const icon = isDir ? 'fa-folder' : 'fa-file-code';
                    const color = isDir ? '#ffca28' : '#1a73e8';

                    const item = document.createElement('a');
                    item.href = isDir ? `${file.name}/index.html` : file.name;
                    item.className = 'item';
                    item.innerHTML = `
                        <span>
                            <i class="fas ${icon}" style="color: ${color}"></i>
                            <span class="file-name">${file.name.replace(/-/g, ' ')}</span>
                        </span>
                        <i class="fas fa-chevron-right" style="font-size: 12px; color: #ccc"></i>
                    `;
                    listElement.appendChild(item);
                }
            });

        } catch (error) {
            listElement.innerHTML = "❌ Lỗi: Không thể đọc dữ liệu từ GitHub. Kiểm tra lại Username/Repo.";
            console.error(error);
        }
    }

    loadFiles();
</script>

</body>
</html>
